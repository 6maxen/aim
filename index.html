<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>aim trainer</title>
<style>

  html,body{height:100%;cursor:default;}
  body{margin:0;background:#0d0f12;color:#eceef2;overflow:hidden;}
  #wrap{position:relative;width:100%;height:100%;overflow:hidden;background:#0d0f12;}
  canvas{display:block;width:100%;height:100%;}

  :root{ --ui: 0.75rem; --cross-arm: 9px; }

  #cross{
    position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;
  }
  #cross span{position:absolute;background:#eceef2;}
  #cross .v{
    left:0;width:1px;
    top:calc(-1 * var(--cross-arm));height:calc(2 * var(--cross-arm) + 1px);
  }
  #cross .h{
    top:0;height:1px;
    left:calc(-1 * var(--cross-arm));width:calc(2 * var(--cross-arm) + 1px);
  }

  #speedo{
    position:absolute;left:1.3em;bottom:1.3em;pointer-events:none;
    font:var(--ui)/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.06em;color:#6f7681;font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;gap:.5em;align-items:flex-start;
  }
  #speedo b{color:#eceef2;font-weight:600;}
  #sensrow{display:flex;align-items:center;gap:.7em;}
  .key{color:#8b939e;font-weight:600;}

  #sens{transition:color .45s ease-in-out;}
  #sens.fine{color:#3ddc84;transition:color .18s ease-in-out;}

  #sensmilli{transition:opacity .7s ease-in-out;}
  #sensmilli.gone{opacity:0;}
  #bar{
    position:relative;width:12em;height:.34em;background:#2a2f36;overflow:hidden;
  }
  #fill{
    position:absolute;left:0;top:0;bottom:0;width:0;background:#eceef2;
    transition:background .12s linear;
  }
  #sensrow.adjusting #fill{background:#ff5a45;}

  #modes{display:flex;flex-wrap:wrap;gap:1.2em;margin-top:.2em;}
  .mode{color:#4a515b;}
  .mode.on{color:#eceef2;font-weight:600;}

  .bind{color:#4a515b;transition:color .45s ease-in-out;}
  .bind.flash{color:#ffffff;transition:color .22s ease-in-out;}

  #stats{
    position:absolute;right:1.3em;bottom:1.3em;pointer-events:none;text-align:right;
    font:var(--ui)/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.06em;color:#6f7681;font-variant-numeric:tabular-nums;
  }
  #stats b{color:#eceef2;font-weight:600;}
  #timerow{font-size:1.9em;line-height:1.25;margin-top:.15em;letter-spacing:.02em;}

  #high{
    position:absolute;right:1.3em;top:1.3em;pointer-events:none;text-align:right;
    font:calc(var(--ui) * 1.15)/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.06em;color:#e8b53a;font-variant-numeric:tabular-nums;
  }
  #high b{color:#ffc83c;font-weight:600;}
  #himode{color:#9a7a2a;font-size:.85em;margin-top:.1em;}

  #spacehint{
    position:absolute;left:50%;bottom:1.3em;transform:translateX(-50%);
    pointer-events:none;white-space:nowrap;
    display:flex;gap:1.4em;
    font:var(--ui)/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.06em;color:#4a515b;
  }

  #newhi{
    position:absolute;left:50%;top:3.2em;pointer-events:none;
    font:calc(var(--ui) * 2.1)/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.22em;color:#ffc83c;
    opacity:0;transform:translate(-50%, .5em);
    transition:opacity .45s ease-in-out, transform .45s ease-in-out;
  }
  #newhi.show{opacity:1;transform:translate(-50%, 0);}

  #fail{
    position:absolute;left:1.3em;top:1.3em;max-width:40ch;
    font:calc(var(--ui) * 1.1)/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#ff6b5a;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="cross"><span class="v"></span><span class="h"></span></div>
  <div id="speedo">
    <div id="sensrow">
      <span>sens</span>
      <span class="key">(−/+)</span>
      <div id="bar"><i id="fill"></i></div>
      <b id="sens"><span id="sensbase">0.25</span><span id="sensmilli"></span></b>
    </div>
    <div id="modes">
      <span class="mode on" data-m="static">1 static</span>
      <span class="mode" data-m="moving">2 moving</span>
      <span class="mode" data-m="flying">3 flying</span>
      <span class="bind" id="bindR">R restart</span>
    </div>
  </div>
  <div id="spacehint">
    <span>SPACE double-jump</span>
    <span>F fullscreen</span>
  </div>
  <div id="newhi">new highscore</div>
  <div id="high">
    <div>highscore: <b id="hi">—</b> seconds</div>
    <div id="himode">(static)</div>
  </div>
  <div id="stats">
    <div><b id="hits">0</b> hits</div>
    <div><b id="misses">0</b> misses</div>
    <div><b id="acc">—</b> accuracy</div>
    <div id="timerow"><b id="time">0.000</b> seconds</div>
  </div>
  <p id="fail" hidden>Couldn't load the 3D library. Reload the page to try again.</p>
</div>

<script type="module">
const wrap   = document.getElementById('wrap');
const crossEl = document.getElementById('cross');
const failEl = document.getElementById('fail');
const sensEl = document.getElementById('sens');
const sensBaseEl = document.getElementById('sensbase');
const sensMilliEl = document.getElementById('sensmilli');
const fillEl = document.getElementById('fill');
const sensRow = document.getElementById('sensrow');
const modeEls = document.querySelectorAll('.mode');
const hitsEl = document.getElementById('hits');
const missEl = document.getElementById('misses');
const accEl  = document.getElementById('acc');
const bindREl = document.getElementById('bindR');
const timeEl = document.getElementById('time');
const hiEl   = document.getElementById('hi');
const hiModeEl = document.getElementById('himode');
const newHiEl = document.getElementById('newhi');
let newHiTimer = 0;

let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
} catch (err) {
  failEl.hidden = false;
  throw err;
}

const SENS_MIN = 0.05, SENS_MAX = 6, SENS_STEP = 0.01;
const SENS_FINE = 0.001;
const SENS_DEFAULT = 0.25;
const SENS_HOLD_DELAY = 0.22;
const SENS_RATE = 0.20;
const SENS_RAMP = 5;
const SENS_RATE_MAX = 3.0;
const SENS_SHIFT_MUL = 0.08;

let valSens = SENS_DEFAULT;
let sensHold = 0;
let sensFloat = valSens;

let fineUsed = false;
let milliTimer = 0;
let milliHidden = false;

try {
  const saved = parseFloat(localStorage.getItem('boxfield.sens5'));
  if (Number.isFinite(saved) && saved >= SENS_MIN && saved <= SENS_MAX) {
    valSens = saved;
    if (Math.round(saved * 1000) % 10 !== 0) fineUsed = true;
  }
} catch (e) {}

const radPerCount = () => valSens * 0.07 * Math.PI / 180;

function setSens(next, grid = SENS_STEP) {
  const snapped = Math.round(next / grid) * grid;
  valSens = Math.min(SENS_MAX, Math.max(SENS_MIN, Math.round(snapped * 1000) / 1000));

  if (grid === SENS_FINE) fineUsed = true;
  const thousandths = Math.round(valSens * 1000) % 10;
  const showMilli = fineUsed || thousandths !== 0;

  const text = valSens.toFixed(showMilli ? 3 : 2);
  sensBaseEl.textContent = showMilli ? text.slice(0, -1) : text;
  sensMilliEl.textContent = showMilli ? text.slice(-1) : '';

  clearTimeout(milliTimer);
  if (!showMilli) {
    milliHidden = false;
  } else if (thousandths !== 0) {
    milliHidden = false;
    sensMilliEl.classList.remove('gone');
  } else if (milliHidden) {
    sensMilliEl.classList.add('gone');
  } else {
    sensMilliEl.classList.remove('gone');
    milliTimer = setTimeout(() => {
      sensMilliEl.classList.add('gone');
      milliHidden = true;
    }, 3000);
  }

  fillEl.style.width = (((valSens - SENS_MIN) / (SENS_MAX - SENS_MIN)) * 100).toFixed(1) + '%';
  try { localStorage.setItem('boxfield.sens5', valSens.toFixed(3)); } catch (e) {}
}

let fineTimer = 0;
function pulseFine() {
  sensEl.classList.add('fine');
  clearTimeout(fineTimer);
  fineTimer = setTimeout(() => sensEl.classList.remove('fine'), 200);
}

const COUNT_SCALE = 1;

setSens(valSens);

const T = {
  maxSpeed:  6.75,
  accel:     10,

  friction:   8,
  stopSpeed:  3.0,
  airAccel:   3,
  airCap:     6.75,
  gravity:   22,
  jumpVel:    6.6,
  airJumps:   1,
  airJumpVel: 14.0,
  airJumpGrav: 1.60,
  glideGrav:  0.20,
  glideFall:  1.60,
  landScale: 0.75,
  eye:       1.65,

  crouchMul: 0.31,
  crouchEye: 1.15,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f12);
scene.fog = new THREE.Fog(0x0d0f12, 40, 130);

const H_FOV = 103;
const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 400);
camera.rotation.order = 'YXZ';

scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdfe6f0, 0x15181d, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.15);
sun.position.set(10, 22, 8);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshLambertMaterial({ color: 0x1b1e23 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const grid = new THREE.GridHelper(200, 100, 0x3a414a, 0x272c33);
grid.position.y = 0.01;
scene.add(grid);

const BALL_R = 0.28, BALL_Y = 1.70, POST_R = 0.018;

const ballGeo = new THREE.SphereGeometry(BALL_R, 24, 16);
const postGeo = new THREE.CylinderGeometry(POST_R, POST_R, 1, 6);
postGeo.translate(0, 0.5, 0);

const SPAWN = [

  [  -8, -14,    0, 5.0, 0.85],
  [   6, -18,   90, 4.0, 1.20],
  [  14,  -8,   35, 6.0, 0.60],
  [ -16,  -6,  110, 3.5, 1.45],
  [   0, -25,    0, 8.0, 0.45],
  [ -22, -18,   60, 5.5, 0.95],
  [  20, -22,  145, 4.5, 1.10],
  [  10,   3,   90, 3.0, 1.60],
  [ -11,   5,    0, 4.0, 1.30],
  [  24,   2,   20, 6.5, 0.70],
  [ -26, -30,   75, 7.0, 0.55],
  [   4, -34,  160, 5.0, 1.00],
];

const targets = SPAWN.map(([x, z, heading, range, speed], i) => {
  const holder = new THREE.Group();
  holder.position.set(x, 0, z);

  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });

  const ball = new THREE.Mesh(ballGeo, mat);
  ball.position.y = BALL_Y;

  const post = new THREE.Mesh(postGeo, mat);
  post.scale.y = BALL_Y - BALL_R;

  holder.add(post, ball);
  scene.add(holder);

  const rad = heading * Math.PI / 180;
  ball.userData = {
    hit: false,
    holder, post,
    ox: x, oz: z,
    dx: Math.cos(rad), dz: Math.sin(rad),
    range, speed,
    phase: i * 1.7,
  };
  return ball;
});

const FLY_Y = 4.20, FLY_AMP = 2.00;
let targetMode = 'static';

function moveTargets(t) {
  for (const b of targets) {
    const d = b.userData;

    if (d.hit) continue;

    if (targetMode === 'static') {
      d.holder.position.set(d.ox, 0, d.oz);
      b.position.y = BALL_Y;
      d.post.visible = true;
      continue;
    }

    const s = Math.sin(t * d.speed + d.phase);
    d.holder.position.x = d.ox + d.dx * s * d.range;
    d.holder.position.z = d.oz + d.dz * s * d.range;

    if (targetMode === 'flying') {
      b.position.y = FLY_Y + Math.sin(t * d.speed * 0.63 + d.phase * 1.7) * FLY_AMP;
      d.post.visible = false;
    } else {
      b.position.y = BALL_Y;
      d.post.visible = true;
    }
  }
}

let hitCount = 0, missCount = 0;

let runStart = null, runEnd = null;

const best = { static: null, moving: null, flying: null };
try {
  const saved = JSON.parse(localStorage.getItem('boxfield.best2') || '{}');
  for (const k of ['static', 'moving', 'flying']) {
    if (Number.isFinite(saved[k]) && saved[k] > 0) best[k] = saved[k];
  }
} catch (e) {}

function drawBest() {
  const b = best[targetMode];
  hiEl.textContent = b === null ? '—' : fmtTime(b);
  hiModeEl.textContent = '(' + targetMode + ')';
}

function recordRun(ms) {
  const b = best[targetMode];
  if (b !== null && ms >= b) return;
  best[targetMode] = ms;
  drawBest();
  try { localStorage.setItem('boxfield.best2', JSON.stringify(best)); } catch (e) {}

  newHiEl.classList.add('show');
  clearTimeout(newHiTimer);
  newHiTimer = setTimeout(() => newHiEl.classList.remove('show'), 1900);
}

function fmtTime(ms) {
  const sec = ms / 1000;
  if (sec < 60) return sec.toFixed(3);
  const m = Math.floor(sec / 60);
  return m + ':' + (sec - m * 60).toFixed(3).padStart(6, '0');
}

function drawScore() {
  hitsEl.textContent = hitCount;
  missEl.textContent = missCount;
  const shots = hitCount + missCount;
  accEl.textContent = shots ? (hitCount / shots * 100).toFixed(1) + '%' : '—';
}

function drawTime() {
  if (runStart === null) { timeEl.textContent = '0.000'; return; }
  timeEl.textContent = fmtTime((runEnd ?? performance.now()) - runStart);
}

function scatterTargets() {
  const placed = [];
  for (const b of targets) {
    const d = b.userData;
    let x = 0, z = 0;
    for (let i = 0; i < 60; i++) {
      x = (Math.random() * 2 - 1) * 30;
      z = -4 - Math.random() * 34;
      if (Math.hypot(x, z - 12) < 10) continue;
      if (placed.every((p) => Math.hypot(p[0] - x, p[1] - z) > 5)) break;
    }
    placed.push([x, z]);

    const heading = Math.random() * Math.PI * 2;
    d.ox = x; d.oz = z;
    d.dx = Math.cos(heading); d.dz = Math.sin(heading);
    d.range = 3 + Math.random() * 5;
    d.speed = 0.45 + Math.random() * 1.2;
    d.phase = Math.random() * Math.PI * 2;
    d.holder.position.set(x, 0, z);
  }
}

function resetRange() {
  scatterTargets();
  for (const b of targets) {
    b.userData.hit = false;
    b.material.color.set(0xffffff);
  }
  hitCount = 0;
  missCount = 0;
  runStart = null;
  runEnd = null;
  drawScore();
  drawTime();
}

drawBest();

function setTargetMode(m) {
  targetMode = m;
  for (const el of modeEls) el.classList.toggle('on', el.dataset.m === m);
  drawBest();

  resetRange();
}

const MUZZLE = new THREE.Vector3(0.26, -0.200, -2.40);
const MUZZLE_NEAR = new THREE.Vector3(0.22, -0.200, -0.75);

const TRACER_COUNT = 16, TRACER_TRAVEL = 0.060, TRACER_FADE = 0.050, TRACER_RANGE = 70;
const TRACER_UP = new THREE.Vector3(0, 1, 0);

const tracerGeo = new THREE.CylinderGeometry(0.006, 0.006, 1, 6, 1, true);
tracerGeo.translate(0, 0.5, 0);

const tracers = [];
for (let i = 0; i < TRACER_COUNT; i++) {
  const mesh = new THREE.Mesh(tracerGeo, new THREE.MeshBasicMaterial({
    color: 0xffb43c, transparent: true, opacity: 0, depthWrite: false, fog: false,
  }));
  mesh.visible = false;
  camera.add(mesh);
  tracers.push({
    mesh,
    origin: new THREE.Vector3(),
    dir: new THREE.Vector3(),
    total: 0, streak: 0, t: 0, fade: 0, active: false,
  });
}
let tracerIdx = 0;

const tmpDir = new THREE.Vector3();

const TRACER_TRUE = 0xffb43c;
const TRACER_OFF  = 0x3aa0ff;

function spawnTracer(from, to, color) {
  const tr = tracers[tracerIdx++ % TRACER_COUNT];
  tmpDir.subVectors(to, from);
  const len = tmpDir.length();
  if (len < 0.01) return;

  tr.origin.copy(from);
  tr.dir.copy(tmpDir).divideScalar(len);
  tr.total  = len;
  tr.streak = Math.min(Math.max(len * 0.35, 2), 14);
  tr.t = 0;
  tr.fade = 0;
  tr.active = true;

  tr.mesh.quaternion.setFromUnitVectors(TRACER_UP, tr.dir);
  tr.mesh.material.color.set(color);
  tr.mesh.material.opacity = 1;
  tr.mesh.visible = true;
}

function updateTracers(dt) {
  for (const tr of tracers) {
    if (!tr.active) continue;

    let head, tail, k;
    if (tr.t < 1) {
      tr.t = Math.min(1, tr.t + dt / TRACER_TRAVEL);
      head = tr.total * tr.t;
      tail = Math.max(0, head - tr.streak);
      k = 1;
    } else {
      tr.fade += dt;
      const f = Math.min(tr.fade / TRACER_FADE, 1);
      head = tr.total;
      tail = Math.max(0, tr.total - tr.streak * (1 - f));
      k = 1 - f;
      if (f >= 1) { tr.active = false; tr.mesh.visible = false; continue; }
    }

    const seg = head - tail;
    if (seg <= 0.001) { tr.mesh.visible = false; continue; }

    tr.mesh.position.copy(tr.origin).addScaledVector(tr.dir, tail);

    const mid = tail + seg * 0.5;
    const dist = Math.hypot(
      tr.origin.x + tr.dir.x * mid,
      tr.origin.y + tr.dir.y * mid,
      tr.origin.z + tr.dir.z * mid,
    );
    const thick = Math.min(Math.max(dist * 0.40, 1), 200);

    tr.mesh.scale.set(thick, seg, thick);
    tr.mesh.material.opacity = k;
    tr.mesh.visible = true;
  }
}

const BOUND = 90;

const keys = Object.create(null);
let yaw = 0, pitch = 0, locked = false;
let vx = 0, vz = 0, vy = 0;
let grounded = true, eyeHeight = T.eye;
let jumpEdge = false;
let jumpsLeft = T.airJumps;
let airLift = false;
let crouching = false;
let airCap = T.maxSpeed;

const pos = new THREE.Vector3(0, 0, 12);

const ray = new THREE.Raycaster();
const CENTER = new THREE.Vector2(0, 0);

function applyFriction(dt) {
  const speed = Math.hypot(vx, vz);
  if (speed < 1e-4) { vx = 0; vz = 0; return; }
  const control = speed < T.stopSpeed ? T.stopSpeed : speed;
  const drop = control * T.friction * dt;
  const scale = Math.max(speed - drop, 0) / speed;
  vx *= scale; vz *= scale;
}

function accelerate(wx, wz, wishSpeed, accel, dt) {
  const current = vx * wx + vz * wz;
  const addSpeed = wishSpeed - current;
  if (addSpeed <= 0) return;
  let accelSpeed = accel * wishSpeed * dt;
  if (accelSpeed > addSpeed) accelSpeed = addSpeed;
  vx += accelSpeed * wx;
  vz += accelSpeed * wz;
}

function wishSpeedNow() {
  return crouching ? T.maxSpeed * T.crouchMul : T.maxSpeed;
}

function move(dt) {
  const fwd  = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
  const side = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);

  let wx = 0, wz = 0;
  if (fwd || side) {
    const sy = Math.sin(yaw), cy = Math.cos(yaw);
    wx = -sy * fwd + cy * side;
    wz = -cy * fwd - sy * side;
    const len = Math.hypot(wx, wz);
    wx /= len; wz /= len;
  }
  const wishSpeed = (fwd || side) ? wishSpeedNow() : 0;

  if (grounded) {
    applyFriction(dt);
    if (wishSpeed > 0) accelerate(wx, wz, wishSpeed, T.accel, dt);

    if (jumpEdge) {
      vy = T.jumpVel;
      grounded = false;
      jumpsLeft = T.airJumps;
      airCap = Math.max(T.maxSpeed, Math.hypot(vx, vz));
    }
  } else {
    if (jumpEdge && jumpsLeft > 0) {
      vy = T.airJumpVel;
      jumpsLeft--;
      airLift = true;
    }

    if (wishSpeed > 0) accelerate(wx, wz, wishSpeed, T.airAccel, dt);

    const hs = Math.hypot(vx, vz);
    if (hs > T.maxSpeed) {
      const excess = hs - T.maxSpeed;
      const control = Math.max(excess, T.stopSpeed);
      const left = Math.max(0, excess - control * T.friction * dt);
      const target = Math.min(T.maxSpeed + left, airCap);
      vx *= target / hs; vz *= target / hs;
    }

    const gliding = keys.Space && vy < 0;
    if (vy <= 0) airLift = false;
    let g = T.gravity;
    if (gliding) g *= T.glideGrav;
    else if (airLift) g *= T.airJumpGrav;

    vy -= g * dt;
    if (gliding && vy < -T.glideFall) vy = -T.glideFall;
  }
  jumpEdge = false;

  pos.x += vx * dt;
  pos.z += vz * dt;
  pos.y += vy * dt;

  if (pos.y <= 0) {
    pos.y = 0; vy = 0; grounded = true; jumpsLeft = T.airJumps; airLift = false;
    airCap = T.maxSpeed;
  }

  pos.x = Math.max(-BOUND, Math.min(BOUND, pos.x));
  pos.z = Math.max(-BOUND, Math.min(BOUND, pos.z));

  const targetEye = crouching ? T.crouchEye : T.eye;
  eyeHeight += (targetEye - eyeHeight) * Math.min(1, 14 * dt);
}

let freshLock = false;

wrap.addEventListener('click', async () => {
  if (locked) return;
  try {
    const p = wrap.requestPointerLock({ unadjustedMovement: true });
    if (p && typeof p.then === 'function') await p;
  } catch (e) {
    try { await wrap.requestPointerLock(); } catch (e2) {}
  }
});

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === wrap;
  if (locked) freshLock = true;
  else for (const k in keys) keys[k] = false;
});

const MAX_DELTA = 1200;
document.addEventListener('mousemove', (e) => {
  if (!locked) return;
  if (freshLock) { freshLock = false; return; }
  const dx = e.movementX, dy = e.movementY;
  if (!Number.isFinite(dx) || !Number.isFinite(dy)) return;
  if (Math.abs(dx) > MAX_DELTA || Math.abs(dy) > MAX_DELTA) return;

  const rad = COUNT_SCALE * radPerCount();
  yaw   -= dx * rad;
  pitch -= dy * rad;
  pitch = Math.max(-Math.PI / 2 + 0.02, Math.min(Math.PI / 2 - 0.02, pitch));
});

addEventListener('keydown', (e) => {
  if (!e.repeat) {
    const fine = e.shiftKey;
    const step = fine ? SENS_FINE : SENS_STEP;

    const grid = SENS_FINE;
    if (e.code === 'Minus' || e.code === 'NumpadSubtract') { setSens(valSens - step, grid); sensHold = 0; sensFloat = valSens; if (fine) pulseFine(); }
    if (e.code === 'Equal' || e.code === 'NumpadAdd')      { setSens(valSens + step, grid); sensHold = 0; sensFloat = valSens; if (fine) pulseFine(); }
  }

  if (e.repeat) { keys[e.code] = true; return; }
  if (e.code === 'Space') { e.preventDefault(); if (locked) jumpEdge = true; }
  if (e.code === 'ControlLeft' || e.code === 'ControlRight') { e.preventDefault(); crouching = true; }
  if (e.code === 'Digit1' || e.code === 'Numpad1') setTargetMode('static');
  if (e.code === 'Digit2' || e.code === 'Numpad2') setTargetMode('moving');
  if (e.code === 'Digit3' || e.code === 'Numpad3') setTargetMode('flying');
  if (e.code === 'KeyR') {
    resetRange();
    bindREl.classList.add('flash');
  }
  if (e.code === 'KeyF') {
    e.preventDefault();
    toggleFullscreen();
  }
  keys[e.code] = true;
});

addEventListener('keyup', (e) => {
  if (e.code === 'KeyR') bindREl.classList.remove('flash');
  if (e.code === 'ControlLeft' || e.code === 'ControlRight') crouching = false;
  keys[e.code] = false;
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; crouching = false; bindREl.classList.remove('flash'); });

function toggleFullscreen() {
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl) {
    (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    return;
  }
  const req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
  try {
    const p = req?.call(wrap);
    if (p && typeof p.catch === 'function') p.catch(() => {});
  } catch (e) {}
}

for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) {
  document.addEventListener(ev, () => setTimeout(resize, 0));
}

const DEADZONE   = 0.50;
const SPREAD_RUN = 4.5 * Math.PI / 180;

function spreadNow() {
  if (!grounded) return 0;
  const r = Math.min(Math.hypot(vx, vz) / T.maxSpeed, 1.5);
  return r <= DEADZONE ? 0 : ((r - DEADZONE) / (1 - DEADZONE)) * SPREAD_RUN;
}

const shotEnd = new THREE.Vector3();
const camRight = new THREE.Vector3();
const camUp = new THREE.Vector3();

wrap.addEventListener('mousedown', (e) => {
  if (!locked || e.button !== 0) return;

  ray.setFromCamera(CENTER, camera);

  const spread = spreadNow();
  if (spread > 0.0001) {
    const ang = Math.random() * Math.PI * 2;
    const rad = Math.sqrt(Math.random()) * spread;
    const t = Math.tan(rad);
    camRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
    camUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
    ray.ray.direction
      .addScaledVector(camRight, Math.cos(ang) * t)
      .addScaledVector(camUp, Math.sin(ang) * t)
      .normalize();
  }

  const hits = ray.intersectObjects(targets, false);
  const floor = ray.intersectObject(ground, false);

  const ballDist  = hits.length ? hits[0].distance : Infinity;
  const floorDist = floor.length ? floor[0].distance : Infinity;

  const scoring = runEnd === null;

  if (ballDist <= floorDist && hits.length) {
    shotEnd.copy(hits[0].point);
    const ball = hits[0].object;
    if (!ball.userData.hit) {
      ball.userData.hit = true;
      ball.material.color.set(0xff4a35);
      if (runStart === null) runStart = performance.now();
      if (targets.every((t) => t.userData.hit)) {
        runEnd = performance.now();
        drawTime();
        recordRun(runEnd - runStart);
      }
    }
    if (scoring) hitCount++;
  } else {
    if (scoring) missCount++;
    if (floor.length) shotEnd.copy(floor[0].point);
    else shotEnd.copy(camera.position).addScaledVector(ray.ray.direction, TRACER_RANGE);
  }
  drawScore();

  camera.worldToLocal(shotEnd);

  const from = shotEnd.z < MUZZLE.z ? MUZZLE : MUZZLE_NEAR;
  if (shotEnd.z < from.z) {
    const tint = spread > 0.0001 ? TRACER_OFF : TRACER_TRUE;
    spawnTracer(from, shotEnd, tint);
  }
});

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);

  const dpr = window.devicePixelRatio || 1;
  const snap = (v) => Math.round(v * dpr) / dpr;
  crossEl.style.left = snap(w / 2) + 'px';
  crossEl.style.top  = snap(h / 2) + 'px';

  camera.aspect = w / Math.max(h, 1);

  const half = Math.tan(H_FOV * Math.PI / 360);
  const vFov = 2 * Math.atan(half / camera.aspect) * 180 / Math.PI;
  camera.fov = Math.min(vFov, 120);

  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();

renderer.setAnimationLoop(() => {
  const frame = Math.min(clock.getDelta(), 0.1);

  moveTargets(clock.elapsedTime);
  updateTracers(frame);

  const sensDir = ((keys.Equal || keys.NumpadAdd) ? 1 : 0)
                - ((keys.Minus || keys.NumpadSubtract) ? 1 : 0);
  if (sensDir) {
    sensHold += frame;
    if (sensHold > SENS_HOLD_DELAY) {
      const t = sensHold - SENS_HOLD_DELAY;
      const fine = keys.ShiftLeft || keys.ShiftRight;
      let rate = Math.min(SENS_RATE * (1 + SENS_RAMP * t), SENS_RATE_MAX);
      if (fine) rate *= SENS_SHIFT_MUL;
      sensFloat = Math.min(SENS_MAX, Math.max(SENS_MIN, sensFloat + sensDir * rate * frame));
      setSens(sensFloat, fine ? SENS_FINE : SENS_STEP);
      if (fine) pulseFine();
    }
  } else {
    sensHold = 0;
    sensFloat = valSens;
  }
  sensRow.classList.toggle('adjusting', sensDir !== 0);

  if (locked) {
    const STEP = 1 / 128;
    let remaining = frame;
    while (remaining > 0) {
      const dt = Math.min(STEP, remaining);
      move(dt);
      remaining -= dt;
    }
  }

  camera.position.set(pos.x, pos.y + eyeHeight, pos.z);
  camera.rotation.set(pitch, yaw, 0);

  if (runStart !== null && runEnd === null) drawTime();

  renderer.render(scene, camera);
});

</script>
</body>
</html>
